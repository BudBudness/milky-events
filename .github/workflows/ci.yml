name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: milky-events-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: milky_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: milky_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d milky_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Verify database schema contract
        run: npm run verify:schema
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install migration test dependency
        run: python -m pip install "psycopg[binary]==3.2.3"
      - name: Apply migration and test database workflows
        run: python scripts/verify-migration.py
        env:
          DATABASE_URL: postgresql://postgres:milky_test_password@localhost:5432/milky_test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
